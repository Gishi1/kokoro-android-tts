# F-Droid build metadata for dev.kokoro.tts (Kokoro Android system TTS driver).
#
# The live copy lives in fdroiddata as metadata/dev.kokoro.tts.yml. This copy is kept
# beside the source so a release records how it was built; to propose a release, copy
# this file into a clone of https://gitlab.com/fdroid/fdroiddata and open a merge
# request.
#
# Why this app suits F-Droid: it has no dependencies at all -- no JARs, no Maven, no
# prebuilts -- so there is nothing to vet for the free-software requirement, and
# F-Droid builds and signs it with F-Droid's own key. It needs no anti-features: the
# endpoint is user-configurable, so the TetheredNet anti-feature explicitly does not
# apply ("would not be applied if there is a simple configuration option that allows
# pointing the app to a running instance of an ... alternative, publicly available,
# self-hostable server solution").

Categories:
  - Text to Speech
  - System

License: Apache-2.0

AuthorName: Gishi
SourceCode: https://github.com/Gishi1/kokoro-android-tts
IssueTracker: https://github.com/Gishi1/kokoro-android-tts/issues
Changelog: https://github.com/Gishi1/kokoro-android-tts/releases

# The inclusion policy asks that donation links be verifiable as upstream's, so that
# nobody can add one on the developer's behalf. .github/FUNDING.yml in the source
# repo publishes the same link from the same account.
Donate: https://ko-fi.com/gishi

AutoName: Kokoro TTS
Name: Kokoro Android system TTS driver

RepoType: git
Repo: https://github.com/Gishi1/kokoro-android-tts

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 6cc5b12dee6b868b966fc8dfe0b9982d78481c3c
    # No Gradle: android/build.py drives aapt2 -> javac -> d8 -> zipalign itself. It
    # needs only a JDK and the Android SDK, takes minSdk/targetSdk from the manifest,
    # and compiles against whichever build-tools and platform the build server has,
    # so nothing needs pinning and no sudo is required. `--unsigned` because F-Droid
    # signs the APK with its own key and `output:` expects an unsigned one.
    #
    # APP_VERSION_* carries the metadata's declared version into the build, and
    # build.py passes aapt2 --replace-version so it wins over the manifest.
    build:
      - APP_VERSION_NAME=$$VERSION$$ APP_VERSION_CODE=$$VERCODE$$ python3 android/build.py --unsigned
    output: android/kokoro-tts-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
# The manifest is not at the repository root, so point the version check at it
# explicitly rather than relying on it being discovered.
UpdateCheckData: 'android/AndroidManifest.xml|versionCode="(\d+)"|.|versionName="([^"]*)"'
CurrentVersion: '1.0'
CurrentVersionCode: 1
